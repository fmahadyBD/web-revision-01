<div class="container-fluid card login-container">
    <h3 class="text-center">Create an account</h3>
    <hr>
    <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
        <p *ngFor=" let msg of errorMsg">{{msg}}</p>
    </div>
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input [(ngModel)]="registerRequest.name" type="text" name="name" id="name" class="form-control">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">email</label>
        <input [(ngModel)]="registerRequest.email" type="email" name="email" id="email" class="form-control">

    </div>
    <div class="mb-3">
        <label for="password" class="form-control">Password</label>
        <input [(ngModel)]="registerRequest.password" type="password" name="password" id="password"
            class="form-control">
    </div>
    <div class="d-flex justify-content-between mb-3">
        <button (click)="register()" type="button" class="btn btn-primary">
            <em class="fas fa-sing-in-alt">&nbsp; Create an account </em>
        </button>
        <div class="">
            Already have an account? &nbsp;
            <button (click)="login()" class="btn btn-link">Login</button>
        </div>
    </div>

</div>
