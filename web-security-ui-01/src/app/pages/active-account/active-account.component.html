<div class="container" *ngIf="submitted; else codeForm">
    <div class="activation-message" *ngIf="isOkay; else activationError">
        <h2>Activation Successfuul!</h2>
        <p>Your account has been successfullu activated.</p>
        <button class="btn btn-primary" (click)="refirectToLogin()">
            Go to login
        </button>
    </div>
    <ng-template #activationError>
        <div class="activation-error">
            <h2>Activation Failed!</h2>
            <p>{{ message }}</p>
            <button class="btn btn-primary" (click)="submited = false">
                Try again
            </button>
        </div>
    </ng-template>
</div>

<ng-template #codeForm>
    <div class="container">
        <h2>Type your activation code</h2>
        <code-input [isCodeHidden]="false" [codeLength]="6" [code]="'number'" (codeCompleted)="onCodeCompleted($event)">
        </code-input>
        <button class="btn btn-primary mt-3" (code)="redirectToLogin()">
            Go To Login
        </button>
    </div>
</ng-template>
